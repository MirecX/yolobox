services:
  yolobox:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        USERNAME: ${YOLO_USERNAME:-yolo}
        # Bake the host user's UID/GID into the image so the container user and
        # its home directory are created with matching ownership from the start.
        # The entrypoint remap (below) remains as a runtime safety net.
        USER_UID: ${HOST_UID:-1000}
        USER_GID: ${HOST_GID:-1000}
        GITHUB_USERNAME: ${GITHUB_USERNAME}
        INSTALL_PI: ${INSTALL_PI:-true}
    image: ${DOCKER_IMAGE:-yoloimage}
    container_name: ${CONTAINER_NAME:-yolo-claudecode}
    hostname: ${CONTAINER_NAME:-yolo-claudecode}

    environment:
      # Host user UID/GID to align the in-container user with, so files written to
      # the mounted /workspace stay accessible on the host. If unset, the entrypoint
      # auto-detects from the /workspace mount owner. Set in .env or export before
      # `docker compose up`, e.g. HOST_UID=$(id -u) HOST_GID=$(id -g).
      HOST_UID: ${HOST_UID:-}
      HOST_GID: ${HOST_GID:-}
      # Simplified LLM configuration - auto-discovers models from endpoint
      LLM_ENDPOINT: ${LLM_ENDPOINT:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      # Transport for the generated provider: openai-completions (default) or
      # anthropic-no-timeout (slow Anthropic-Messages endpoint; needs INSTALL_PI=true).
      LLM_API: ${LLM_API:-}
      # Point Claude Code at a local LLM. When true, the entrypoint writes
      # ~/.claude/settings.json (ANTHROPIC_BASE_URL/token/model). Base URL and token
      # default to LLM_ENDPOINT / LLM_API_KEY; model auto-discovers from {base}/v1/models.
      CLAUDE_LOCAL_LLM: ${CLAUDE_LOCAL_LLM:-}
      CLAUDE_BASE_URL: ${CLAUDE_BASE_URL:-}
      CLAUDE_AUTH_TOKEN: ${CLAUDE_AUTH_TOKEN:-}
      CLAUDE_MODEL: ${CLAUDE_MODEL:-}
      # SearXNG endpoint for the pi-searxng extension (web_search/web_fetch). Point every
      # box at ONE shared SearXNG instance; nothing is bundled per-box. Port 9369 by
      # convention (avoids common forwarded ports). If unset, the extension defaults to
      # http://localhost:9369.
      SEARXNG_URL: ${SEARXNG_URL:-}

    ports:
      - "${HOST_PORT:-22222}:22"

    volumes:
      - ${WORKSPACE_PATH:-${HOME}/workspace/${CONTAINER_NAME:-yolo-claudecode}}:/workspace

    restart: unless-stopped

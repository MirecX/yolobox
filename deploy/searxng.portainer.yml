# SearXNG — deploy as a Portainer stack (Stacks → Add stack → Web editor → paste → Deploy).
#
# One shared instance serves many yoloboxes. It exposes SearXNG on host port 9369 with:
#   • the JSON API enabled  — required by the pi-searxng extension (`/search?format=json`)
#   • the limiter disabled   — so programmatic clients aren't treated as bots
#   • a random secret_key    — generated once into the named volume on first deploy
#
# No file needs to be placed on the Docker host: the `searxng-init` step writes a minimal
# `settings.yml` (overlaying SearXNG's defaults) into the shared volume before SearXNG starts.
#
# After deploying, point every box at it:   SEARXNG_URL=http://<docker-host>:9369
# Optionally set SEARXNG_BASE_URL (Portainer → stack → Environment variables) to the URL
# clients use, e.g. http://<docker-host>:9369/ .

services:
  searxng-init:
    image: busybox:1.36
    restart: "no"
    command:
      - sh
      - -c
      - |
        set -e
        F=/etc/searxng/settings.yml
        if [ ! -f "$$F" ]; then
          S=$$(head -c 32 /dev/urandom | od -An -tx1 | tr -d ' \n')
          printf 'use_default_settings: true\nserver:\n  secret_key: "%s"\n  limiter: false\nsearch:\n  formats:\n    - html\n    - json\n' "$$S" > "$$F"
          echo "searxng-init: wrote $$F (json enabled, limiter off, random secret)"
        else
          echo "searxng-init: $$F already exists; leaving it untouched"
        fi
    volumes:
      - searxng:/etc/searxng

  searxng:
    image: searxng/searxng:latest
    depends_on:
      searxng-init:
        condition: service_completed_successfully
    ports:
      - "9369:8080"
    environment:
      - SEARXNG_BASE_URL=${SEARXNG_BASE_URL:-http://localhost:9369/}
    volumes:
      - searxng:/etc/searxng
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    restart: unless-stopped

volumes:
  searxng:
